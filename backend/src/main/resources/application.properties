spring.application.name=hostel-management-api
server.port=${PORT:8080}

# Create/update tables automatically while developing.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Set DB_USERNAME and DB_PASSWORD in the environment for local MySQL credentials.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hostel_management?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.security.jwt-secret=${JWT_SECRET:local-development-only-key-change-before-deployment-2026}
app.security.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:1800}
